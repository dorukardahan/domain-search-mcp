name: Secret Guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned scanner
        run: |
          bash scripts/security/install-gitleaks.sh "$RUNNER_TEMP/guard-bin"
          echo "$RUNNER_TEMP/guard-bin" >> "$GITHUB_PATH"
      - name: Test safety controls
        run: python3 scripts/security/test_guards.py
      - name: Scan complete changed blobs in every introduced commit
        env:
          BEFORE: ${{ github.event.before || github.event.pull_request.base.sha }}
        run: python3 scripts/security/scan_commits.py
